[project]
name = "ingredients-calculator"
version = "0.1.0"
description = "Flask frontend over an SQLite ingredients database"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "rapidfuzz>=3.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingredients_calculator"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
